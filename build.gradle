plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    // Gradle 9 fails to run any test without the launcher on the test runtime.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.fxml']
}

application {
    mainClass = 'esu.algorithm.ui.EsuApp'
}

// The 2018 NetBeans layout keeps sources and resources (.fxml, .jpg, .txt)
// in the same tree, so both source sets point at it.
sourceSets {
    main {
        java {
            srcDirs = ['ESU Algorithm/src']
        }
        resources {
            srcDirs = ['ESU Algorithm/src']
            exclude '**/*.java'
        }
    }
    test {
        java {
            srcDirs = ['ESU Algorithm/test']
        }
        resources {
            srcDirs = ['samples']
        }
    }
}
