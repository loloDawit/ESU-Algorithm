name: Bug report
description: Something behaves differently from what it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. If the algorithm reports the wrong
        subgraphs, say so plainly — that is the most serious kind of bug this
        project can have, and there is a brute-force oracle in the test suite
        for settling it.

  - type: dropdown
    id: where
    attributes:
      label: Where did this happen?
      options:
        - The browser demo
        - The desktop app
        - Building or running the project
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can someone else see it?
      description: >
        The graph, the subgraph size, and what you clicked. If it is your own
        graph file, paste it — they are only a few lines.
      placeholder: |
        1. Open the demo, choose Kite
        2. Set size to 4
        3. Press Play
        4. At step 9 the tree shows ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Java version, if this is the desktop app
      description: The output of `java -version`. The build needs JDK 21.
