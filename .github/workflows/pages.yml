# Publishes docs/ to GitHub Pages.
#
# Using a workflow rather than "deploy from a branch" means the Pages source
# is set here in the repository, not by hand in Settings.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The demo is built into docs/demo/ rather than committed, so the site
      # cannot ship a bundle that is out of step with its source.
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

      # enablement: true switches Pages to build from this workflow, which is
      # the setting that would otherwise have to be changed in the UI.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
