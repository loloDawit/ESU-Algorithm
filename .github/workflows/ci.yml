# Builds and tests on every push and pull request.
#
# The algorithm is checked against a brute-force oracle, so a regression in it
# fails here rather than in a screenshot.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # No display is needed: the engine and the tree layout hold no JavaFX
      # reference, and nothing here starts the toolkit.
      - run: ./gradlew test --no-daemon

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      # Includes the fixtures generated from the Java engine, so a change to
      # one implementation and not the other fails here.
      - run: npm test
        working-directory: web
