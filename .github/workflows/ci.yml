# Builds and tests on every push and pull request.
#
# The algorithm is checked against a brute-force oracle, so a regression in it
# fails here rather than in a screenshot.
name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # No display is needed: the engine and the tree layout hold no JavaFX
      # reference, and nothing here starts the toolkit.
      - run: ./gradlew test --no-daemon

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
